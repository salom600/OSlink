# AetherOS GRUB Configuration for ISO Boot

# Set default boot entry
default=0
timeout=10

# AetherOS branding
menuentry "AetherOS Live Session" --class aetheros --class gnu-linux --class gnu --class os {
    load_video
    set gfxpayload=keep
    insmod gzio
    insmod part_msdos
    insmod ext2
    search --no-floppy --set=root --file /aetheros/boot/vmlinuz-linux-lts
    linux /aetheros/boot/vmlinuz-linux-lts archisobasedir=aetheros archisolabel=AETHER_$(date +%Y%m) quiet splash
    initrd /aetheros/boot/initramfs-linux-lts.img
}

menuentry "AetherOS Live Session (Safe Mode)" --class aetheros --class gnu-linux --class gnu --class os {
    load_video
    set gfxpayload=keep
    insmod gzio
    insmod part_msdos
    insmod ext2
    search --no-floppy --set=root --file /aetheros/boot/vmlinuz-linux-lts
    linux /aetheros/boot/vmlinuz-linux-lts archisobasedir=aetheros archisolabel=AETHER_$(date +%Y%m) nosplash noapic
    initrd /aetheros/boot/initramfs-linux-lts.img
}

menuentry "AetherOS Install (Text Mode)" --class aetheros --class gnu-linux --class gnu --class os {
    load_video
    set gfxpayload=text
    insmod gzio
    insmod part_msdos
    insmod ext2
    search --no-floppy --set=root --file /aetheros/boot/vmlinuz-linux-lts
    linux /aetheros/boot/vmlinuz-linux-lts archisobasedir=aetheros archisolabel=AETHER_$(date +%Y%m) text
    initrd /aetheros/boot/initramfs-linux-lts.img
}

menuentry "Memory Test (memtest86+)" --class memtest {
    insmod part_msdos
    insmod ext2
    search --no-floppy --set=root --file /aetheros/boot/memtest
    linux /aetheros/boot/memtest
}

menuentry "Reboot" --class restart {
    reboot
}

menuentry "Power Off" --class poweroff {
    halt
}
