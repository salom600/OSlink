# AetherOS Live Session - Safe Mode (UEFI boot entry)
#
# IMPORTANT: Use archiso placeholders ONLY:
#   %ARCHISO_LABEL% = ISO volume label (e.g. AETHER_202607)
#   %INSTALLISO_UUID% = ISO UUID
#   %INSTALL_DIR%   = install_dir from profiledef.sh (e.g. aetheros)
#   %ARCH%          = architecture (e.g. x86_64)
#
# CRITICAL: Kernel files are at /%INSTALL_DIR%/boot/%ARCH%/ on the
# EFI FAT partition, NOT at /%INSTALL_DIR%/boot/ — mkarchiso places
# them with the arch directory!

title   AetherOS Live Session (Safe Mode)
linux   /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-lts
initrd  /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-lts.img
options archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% nosplash
