# AetherOS mkinitcpio Configuration
# Optimized for fast boot and minimal RAM usage

MODULES=(nvidia nvidia_modeset nvidia_uvm nvidia_drm i915 amdgpu)

BINARIES=(setfont)

FILES=()

HOOKS=(base udev autodetect modconf kms keyboard keymap consolefont block filesystems fsck)

COMPRESSION="zstd"
COMPRESSION_OPTIONS="-9"

# Reduce initramfs size
REMOVE_DEFAULT_MODULES="yes"
