# AetherOS mkinitcpio Configuration
# Optimized for fast boot and minimal RAM usage
#
# CRITICAL: The 'archiso' hook MUST be in HOOKS for live ISO boot!
# Without it, the initramfs cannot find the ISO device (archisolabel=)
# resulting in "device '' not found" emergency shell.
#
# Essential MODULES for archiso live boot (with REMOVE_DEFAULT_MODULES):
#   loop      — mount squashfs as loop device
#   squashfs  — decompress the airootfs image
#   overlay   — overlay filesystem for live session writes
#   dm_snapshot — device-mapper snapshot for copy-on-write

MODULES=(nvidia nvidia_modeset nvidia_uvm nvidia_drm i915 amdgpu loop squashfs overlay dm_snapshot)

BINARIES=(setfont)

FILES=()

HOOKS=(base udev autodetect modconf kms keyboard keymap consolefont block filesystems fsck archiso)

COMPRESSION="zstd"
COMPRESSION_OPTIONS="-9"

# Reduce initramfs size
REMOVE_DEFAULT_MODULES="yes"
