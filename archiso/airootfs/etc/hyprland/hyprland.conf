# ╔══════════════════════════════════════════════════════════════╗
# ║                    AetherOS Hyprland Config                  ║
# ║         "Where Performance Meets Elegance"                   ║
# ╚══════════════════════════════════════════════════════════════╝

# ── Monitor Configuration ──────────────────────────────────────
# Auto-detect monitors; fallback for virtual environments
monitor = , preferred, auto, 1

# ── Program Execution ──────────────────────────────────────────
$terminal = foot
$fileManager = thunar
$menu = wofi --show drun --prompt "Search..."
$browser = firefox

# ── Environment Variables ──────────────────────────────────────
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,WhiteSur-cursors
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = GDK_BACKEND,wayland
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = _JAVA_AWT_WM_NONREPARENTING,1
env = WLR_NO_HARDWARE_CURSORS,1

# ── Autostart ──────────────────────────────────────────────────
exec-once = waybar
exec-once = mako
exec-once = hyprpaper
exec-once = nwg-dock-hyprland -i -p left -mb 4 -nd 3 -hd 8 -a start
exec-once = /usr/local/bin/aetheros-first-boot
exec-once = dbus-update-activation-environment 2 WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = wl-paste --watch cliphist store
exec-once = pipewire
exec-once = pipewire-pulse
exec-once = wireplumber

# ── Input Configuration ────────────────────────────────────────
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = yes
        disable_while_typing = yes
        tap-to-click = yes
        drag_lock = no
        scroll_factor = 1.0
    }

    sensitivity = 0  # -1.0 to 1.0, 0 means no modification
    force_no_accel = yes
}

# ── General ────────────────────────────────────────────────────
general {
    gaps_in = 4
    gaps_out = 8
    border_width = 2
    col.active_border = rgba(4fc3f7ff) rgba(0288d1ff) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
    allow_tearing = no
    resize_on_border = yes
    hover_border_on_window_border = yes
}

# ── Decoration ─────────────────────────────────────────────────
decoration {
    rounding = 12

    blur {
        enabled = yes
        size = 3
        passes = 2
        new_optimizations = on
        xray = on
        noise = 0.02
        contrast = 0.9
        brightness = 0.9
        vibrancy = 0.1
        vibrancy_darkness = 0.1
    }

    drop_shadow = yes
    shadow_range = 15
    shadow_render_power = 2
    col.shadow = rgba(0000004d)
    col.shadow_inactive = rgba(0000002d)

    dim_inactive = yes
    dim_strength = 0.05
    
    active_opacity = 0.95
    inactive_opacity = 0.85
    fullscreen_opacity = 1.0
}

# ── Animations ─────────────────────────────────────────────────
animations {
    enabled = yes

    bezier = aetherEase, 0.05, 0.9, 0.1, 1.05
    bezier = aetherSnap, 0.25, 1.0, 0.5, 1.0
    bezier = aetherSlide, 0.15, 0.85, 0.25, 1.0

    animation = windows, 1, 7, aetherEase
    animation = windowsOut, 1, 7, aetherSnap, popin 87%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, aetherSlide
    animation = layers, 1, 4, default, fade
    animation = layersOut, 1, 4, default, fade
}

# ── Layouts ────────────────────────────────────────────────────
dwindle {
    pseudotile = yes
    force_split = 2
    preserve_split = yes
    smart_split = no
    smart_resizing = yes
}

master {
    new_status = master
    new_on_top = yes
    orientation = left
}

# ── Misc ────────────────────────────────────────────────────────
misc {
    disable_hyprland_logo = yes
    disable_splash_rendering = yes
    mouse_move_enables_dpms = yes
    key_press_enables_dpms = yes
    vfr = yes
    vrr = 0
    enable_swallowing = yes
    swallow_regex = ^(foot)$
    force_default_wallpaper = 0
    focus_on_activate = yes
    no_direct_scanout = yes
    initial_workspace_tracking = 1
}

# ── Window Rules ───────────────────────────────────────────────
# Floating windows
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(file-roller)$
windowrulev2 = float, class:^(bauh)$
windowrulev2 = float, title:^(Steam Login)$
windowrulev2 = float, class:^(steam)$, title:^(Steam)$
windowrulev2 = float, class:^(calamares)$

# Gaming optimizations
windowrulev2 = fullscreen, class:^(steam_app_)$
windowrulev2 = idleinhibit focus, class:^(steam_app_)$
windowrulev2 = stayfocused, class:^(steam_app_.*)$
windowrulev2 = noblur, class:^(steam_app_)$
windowrulev2 = noanim, class:^(steam_app_)$
windowrulev2 = noinitialfocus, class:^(steam_app_.*)$

# Transparency rules
windowrulev2 = opacity 0.8, class:^(foot)$
windowrulev2 = opacity 0.85, class:^(thunar)$
windowrulev2 = opacity 0.95, class:^(firefox)$

# Size rules
windowrulev2 = size 800 600, class:^(pavucontrol)$
windowrulev2 = size 900 700, class:^(bauh)$

# ── Keybindings ────────────────────────────────────────────────
# Super key = Windows key (familiar for Windows migrants)
$mainMod = SUPER

# Essential shortcuts (Windows-like)
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, F, fullscreen,
bind = $mainMod, D, exec, $menu
bind = $mainMod, B, exec, $browser
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,

# Focus movement
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Window movement
bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, l, movewindow, r
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, j, movewindow, d

# Resize
bind = $mainMod CTRL, h, resizeactive, -30 0
bind = $mainMod CTRL, l, resizeactive, 30 0
bind = $mainMod CTRL, k, resizeactive, 0 -30
bind = $mainMod CTRL, j, resizeactive, 0 30

# Workspace switching (1-10, like Windows taskbar)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scroll through workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Mouse bindings
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Utility keybindings
bind = $mainMod, L, exec, swaylock-effects
bind = $mainMod, Print, exec, grim -g "$(slurp)" - | wl-copy
bind = $mainMod SHIFT, Print, exec, grim - | wl-copy
bind = $mainMod CTRL, Print, exec, grim -g "$(slurp)" ~/Screenshots/$(date +%Y%m%d_%H%M%S).png
bind = $mainMod, V, exec, cliphist list | wofi --show dmenu --prompt "Clipboard:" | cliphist decode | wl-copy
bind = $mainMod, R, exec, $menu

# Volume control (media keys)
bind = , XF86AudioRaiseVolume, exec, volumectl up
bind = , XF86AudioLowerVolume, exec, volumectl down
bind = , XF86AudioMute, exec, volumectl toggle-mute

# Brightness control
bind = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Power key
bind = , XF86PowerOff, exec, wofi --show dmenu --prompt "Power:" --define menu_lines=4 | head -1

# Gaming mode toggle
bind = $mainMod, G, exec, /usr/local/bin/aetheros-gaming-mode
