# AetherOS Calamares Settings
# Designed for Windows-migration-friendly installation

modules-search: [ local, /usr/lib/calamares/modules ]

sequence:
  - show:
    - welcome
    - locale
    - keyboard
    - partition
    - users
    - summary
  - exec:
    - partition
    - mount
    - unpackfs
    - machineid
    - fstab
    - locale
    - keyboard
    - localecfg
    - users
    - displaymanager
    - networkcfg
    - hwclock
    - services
    - packages
    - luksbootkeyfile
    - luksopenswaphookcfg
    - initramfs
    - grubcfg
    - bootloader
    - postinstall
  - show:
    - finished

branding: aetheros

welcome-mode: both
welcome-expert-mode: hidden

quit-mode: never-done

permissions:
  root: true

disable-cancel: false
disable-cancel-during-exec: true

loader-context: hybrid
