# AetherOS Calamares - Partition Module Configuration
# Simplified for Windows migrants: "Erase Disk" as default

defaultPartitionChoice: erase
availablePartitionChoices:
  - erase
  - alongside
  - manual

# Default partition layout for "Erase Disk"
defaultFileSystemType: ext4

partitionLayout:
  - name: "aetheros-boot"
    type: "primary"
    filesystem: "ext4"
    mountPoint: "/boot"
    size: 512M
    attributes:
      bootable: true

  - name: "aetheros-swap"
    type: "primary"
    filesystem: "linuxswap"
    mountPoint: ""
    size: 4G

  - name: "aetheros-root"
    type: "primary"
    filesystem: "ext4"
    mountPoint: "/"
    size: 40G
    attributes:
      nofail: true

  - name: "aetheros-home"
    type: "primary"
    filesystem: "ext4"
    mountPoint: "/home"
    size: remaining
    attributes:
      nofail: true

# EFI partition layout override for UEFI systems
efiPartitionLayout:
  - name: "EFI System Partition"
    type: "primary"
    filesystem: "fat32"
    mountPoint: "/boot/efi"
    size: 512M
    attributes:
      bootable: true
      uefi: true

  - name: "aetheros-swap"
    type: "primary"
    filesystem: "linuxswap"
    mountPoint: ""
    size: 4G

  - name: "aetheros-root"
    type: "primary"
    filesystem: "ext4"
    mountPoint: "/"
    size: 40G

  - name: "aetheros-home"
    type: "primary"
    filesystem: "ext4"
    mountPoint: "/home"
    size: remaining

# LUKS encryption option (advanced)
enableLuks: true
luksFilesystem: ext4

# Do not allow manual partition editing for novice users
alwaysShowPartitionLabels: true
