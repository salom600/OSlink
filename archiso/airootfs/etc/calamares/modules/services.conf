# AetherOS Calamares - Services Module Configuration
# Enable essential services, disable bloat

services:
  enable:
    - NetworkManager
    - bluetooth
    - pipewire
    - pipewire-pulse
    - earlyoom
    - zram-generator
    - aetheros-first-boot

  disable:
    - avahi-daemon
    - cups
    - ModemManager
    - accounts-daemon
    - snapd
    - org.freedesktop.resolve1
    - systemd-homed
    - systemd-userdbd

  mask:
    - systemd-rfkill.service
    - systemd-rfkill.socket
    - lvm2-monitor.service

# Target systemd target (graphical = Hyprland session)
target: graphical
