# AetherOS Calamares - Users Module Configuration
# Simplified for Windows migrants

defaultGroups:
  - name: users
  - name: wheel
    mustExist: true
    system: true
  - name: video
  - name: audio
    mustExist: true
    system: true
  - name: network
    mustExist: true
    system: true
  - name: storage
    mustExist: true
    system: true
  - name: power
  - name: games
  - name: input
  - name: bluetooth
    mustExist: true
    system: true
  - name: docker
    mustExist: false
    system: true

# Auto-login enabled for convenience (like Windows)
doAutoLogin: true

# Hostname
hostname: aetheros

# Set root password disabled by default (sudo-only, like Ubuntu)
setRootPassword: false

# Require strong passwords for security
passwordRequirements:
  minLength: 6
  maxLength: -1

# User icon (avatar)
userIcon: /usr/share/pixmaps/aetheros-user.png

# Default shell for new users
defaultShell: /usr/bin/fish
