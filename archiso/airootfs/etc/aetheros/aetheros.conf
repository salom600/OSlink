# AetherOS System Configuration
# This file defines AetherOS-specific settings

# Version
AETHEROS_VERSION="0.1.0"
AETHEROS_CODENAME="Genesis"

# Default settings
AETHEROS_DEFAULT_BROWSER="firefox"
AETHEROS_DEFAULT_TERMINAL="foot"
AETHEROS_DEFAULT_FILEMANAGER="thunar"
AETHEROS_DEFAULT_EDITOR="mousepad"
AETHEROS_DEFAULT_SHELL="fish"

# Theme settings
AETHEROS_GTK_THEME="WhiteSur-Light"
AETHEROS_ICON_THEME="WhiteSur"
AETHEROS_CURSOR_THEME="WhiteSur-cursors"
AETHEROS_KVANTUM_THEME="WhiteSur"
AETHEROS_WALLPAPER="/usr/share/pixmaps/aetheros-wallpaper.png"

# Performance settings
AETHEROS_MAX_RAM_IDLE="200"  # MB target
AETHEROS_ZRAM_RATIO="0.5"    # 50% of RAM for zram
AETHEROS_ZRAM_COMPRESSOR="lz4"
AETHEROS_EARLYOOM_THRESHOLD="2"  # % minimum memory before OOM kill

# Gaming settings
AETHEROS_PROTON_DEFAULT="Proton-GE"
AETHEROS_GAMEMODE_ENABLED="true"
AETHEROS_GAMESCOPE_ENABLED="true"
