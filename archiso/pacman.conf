#
# /etc/pacman.conf - AetherOS Pacman Configuration
#

[options]
HoldPkg           = pacman glibc
Architecture      = auto
CheckSpace
Color
VerbosePkgLists
ParallelDownloads = 10

# Pacman cache for CI/CD builds (persisted via GitHub Actions cache)
CacheDir = /var/cache/pacman/pkg

# By default, pacman accepts packages signed by keys that the local keyring
# trusts (see pacman-key and its man page), as well as unsigned packages
SigLevel    = Required DatabaseOptional
LocalSigLevel = Optional
RemoteSigLevel = Required

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# NOTE: [community] removed — merged into [extra] as of 2023

[multilib]
Include = /etc/pacman.d/mirrorlist

# Chaotic-AUR - Pre-built binary repository for gaming and popular AUR packages
# Provides pre-built: eza, calamares, proton-ge-custom, gamescope, mangohud, etc.
# Keyring: FBA220DFC832C11735C747735D658004B10F7888
#
# BUILD NOTE: SigLevel uses TrustAll during archiso build because mkarchiso
# creates a fresh airootfs keyring (only archlinux keys). The Chaotic-AUR
# key is NOT in that keyring, so Required DatabaseOptional would fail.
# customize_airootfs.sh changes this back to Required DatabaseOptional
# and properly adds the Chaotic-AUR key for the live system.
[chaotic-aur]
SigLevel = TrustAll
Server = https://cdn-mirror.chaotic.cx/$repo/$arch

# AetherOS custom overlay repository (future use, not yet active)
# Will host: calamares-branding-aetheros, aetheros-default-settings, etc.
