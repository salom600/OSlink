#
# /etc/pacman.conf - AetherOS Pacman Configuration
#

[options]
HoldPkg           = pacman glibc
Architecture      = auto
CheckSpace
Color
VerbosePkgLists
ParallelDownloads = 10

# Use pacman cache for CI/CD builds
CacheDir = /var/cache/pacman/pkg

# Local package cache for archiso build
CacheDir = /tmp/pacman-cache

# We do not want to install packages that are not in the repos
# ILoveCandy

# By default, pacman accepts packages signed by keys that the local keyring
# trusts (see pacman-key and its man page), as well as unsigned packages
SigLevel    = Required DatabaseOptional
LocalSigLevel = Optional
RemoteSigLevel = Required

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[community]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# Chaotic-AUR - Pre-built binary repository for gaming and popular AUR packages
# This eliminates the need for AUR compilation during CI builds
[chaotic-aur]
SigLevel = Never
Server = https://cdn-mirror.chaotic.cx/$repo/$arch

# AetherOS custom overlay repository (future use)
[aetheros]
SigLevel = Never
Server = https://raw.githubusercontent.com/salom600/AetherOS-repo/main/x86_64
