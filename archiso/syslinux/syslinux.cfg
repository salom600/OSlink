# AetherOS SYSLINUX Configuration for ISO Boot (BIOS)

DEFAULT aetheros
PROMPT 0
TIMEOUT 30

# AetherOS branding
MENU TITLE AetherOS - Where Performance Meets Elegance
MENU BACKGROUND /aetheros/syslinux/aetheros-bg.png
MENU COLOR title 1;37;40 #4fc3f7 #0a0a1a 0
MENU COLOR border 30;44 #4fc3f7 #0a0a1a 0
MENU COLOR unsel 37;40 #e0e0e0 #0a0a1a 0
MENU COLOR sel 7;37;40 #0a0a1a #4fc3f7 0
MENU COLOR help 37;40 #e0e0e0 #0a0a1a 0
MENU COLOR timeout_msg 37;40 #e0e0e0 #0a0a1a 0
MENU COLOR timeout 1;37;40 #4fc3f7 #0a0a1a 0

LABEL aetheros
    MENU LABEL AetherOS Live Session
    LINUX /aetheros/boot/vmlinuz-linux-lts
    INITRD /aetheros/boot/initramfs-linux-lts.img
    APPEND archisobasedir=aetheros archisolabel=AETHER_%YEAR% quiet splash

LABEL aetheros-safe
    MENU LABEL AetherOS Live Session (Safe Mode)
    LINUX /aetheros/boot/vmlinuz-linux-lts
    INITRD /aetheros/boot/initramfs-linux-lts.img
    APPEND archisobasedir=aetheros archisolabel=AETHER_%YEAR% nosplash noapic

LABEL aetheros-text
    MENU LABEL AetherOS Install (Text Mode)
    LINUX /aetheros/boot/vmlinuz-linux-lts
    INITRD /aetheros/boot/initramfs-linux-lts.img
    APPEND archisobasedir=aetheros archisolabel=AETHER_%YEAR% text

LABEL memtest
    MENU LABEL Memory Test (memtest86+)
    LINUX /aetheros/boot/memtest

LABEL reboot
    MENU LABEL Reboot
    COM32 reboot.c32

LABEL poweroff
    MENU LABEL Power Off
    COM32 poweroff.c32
