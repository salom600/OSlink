# AetherOS SYSLINUX Configuration for ISO Boot (BIOS)
#
# IMPORTANT: Use archiso placeholders ONLY:
#   %ARCHISO_LABEL% = ISO volume label (e.g. AETHER_202607)
#   %ARCHISO_UUID%  = ISO UUID
#   %INSTALL_DIR%   = install_dir from profiledef.sh (e.g. aetheros)
#   %ARCH%          = architecture (e.g. x86_64)
#
# CRITICAL: Kernel files are at /%INSTALL_DIR%/boot/%ARCH%/ on the ISO,
# NOT at /%INSTALL_DIR%/boot/ — mkarchiso places them with the arch dir!

DEFAULT aetheros
PROMPT 0
TIMEOUT 30

# AetherOS branding
MENU TITLE AetherOS - Where Performance Meets Elegance
MENU COLOR title 1;37;40 #4fc3f7 #0a0a1a 0
MENU COLOR border 30;44 #4fc3f7 #0a0a1a 0
MENU COLOR unsel 37;40 #e0e0e0 #0a0a1a 0
MENU COLOR sel 7;37;40 #0a0a1a #4fc3f7 0
MENU COLOR help 37;40 #e0e0e0 #0a0a1a 0
MENU COLOR timeout_msg 37;40 #e0e0e0 #0a0a1a 0
MENU COLOR timeout 1;37;40 #4fc3f7 #0a0a1a 0

LABEL aetheros
    MENU LABEL AetherOS Live Session
    LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-lts
    INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-lts.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% quiet splash

LABEL aetheros-safe
    MENU LABEL AetherOS Live Session (Safe Mode)
    LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-lts
    INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-lts.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% nosplash noapic

LABEL aetheros-text
    MENU LABEL AetherOS Install (Text Mode)
    LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-lts
    INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-lts.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% text

LABEL reboot
    MENU LABEL Reboot
    COM32 reboot.c32

LABEL poweroff
    MENU LABEL Power Off
    COM32 poweroff.c32
