name: Build AetherOS ISO

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - nightly
          - testing

env:
  ISO_NAME: AetherOS
  BUILD_DIR: /tmp/aetheros-build

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours maximum

    steps:
      # ── Step 1: Aggressive Disk Cleanup ────────────────────────
      # Must happen BEFORE Docker pull. Free ~40GB by removing
      # pre-installed GitHub Actions toolchains manually.
      - name: Free Disk Space (Aggressive)
        run: |
          echo "=== Initial disk usage ==="
          df -h /
          echo ""

          # Remove the largest unused pre-installed packages
          sudo rm -rf /usr/share/dotnet                     ~30GB
          sudo rm -rf /usr/local/lib/android                 ~10GB  
          sudo rm -rf /opt/ghc                               ~6GB
          sudo rm -rf /usr/local/.ghcup                      ~2GB
          sudo rm -rf /opt/hostedtoolcache                   ~10GB
          sudo rm -rf /usr/lib/jvm                            ~2GB
          sudo rm -rf /usr/share/swift                        ~3GB
          sudo rm -rf /usr/local/share/powershell             ~2GB
          sudo rm -rf /usr/share/codeql                       ~5GB

          # Remove Docker images/containers that come pre-installed
          docker system prune -af --volumes 2>/dev/null || true

          # Remove apt cache
          sudo apt-get clean
          sudo rm -rf /var/cache/apt/archives

          # Remove snap packages
          sudo snap list --all | awk '{print $1, $2}' | while read name rev; do sudo snap remove "$name" --revision="$rev" 2>/dev/null; done || true
          sudo rm -rf /snap /var/snap /home/snap

          echo ""
          echo "=== Disk usage after cleanup ==="
          df -h /
          echo "Available: $(df -BG / | tail -1 | awk '{print $4}')"

      # ── Step 2: Checkout Repository ───────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── Step 3: Cache Pacman Packages ─────────────────────────
      - name: Cache Pacman Packages
        uses: actions/cache@v4
        with:
          path: pacman-cache
          key: pacman-${{ hashFiles('archiso/packages.x86_64') }}-v2
          restore-keys: |
            pacman-v2-

      # ── Step 4: Prepare Build Directory ───────────────────────
      - name: Prepare Build Directory
        run: |
          sudo mkdir -p ${BUILD_DIR}/work ${BUILD_DIR}/out ${BUILD_DIR}/profile
          sudo mkdir -p pacman-cache

          # rsync copies CONTENTS of archiso/ INTO profile/,
          # not the archiso/ directory itself
          sudo rsync -a archiso/ ${BUILD_DIR}/profile/
          sudo rsync -a scripts/ ${BUILD_DIR}/scripts/ 2>/dev/null || true
          sudo rsync -a overlays/ ${BUILD_DIR}/overlays/ 2>/dev/null || true

          # Verify profile structure
          echo "=== Profile structure ==="
          ls ${BUILD_DIR}/profile/
          ls ${BUILD_DIR}/profile/airootfs/ || echo "No airootfs dir"
          ls ${BUILD_DIR}/profile/airootfs/usr/local/bin/ 2>/dev/null || echo "No bin dir"

          # Make scripts executable
          sudo find ${BUILD_DIR}/profile -name "*.sh" -exec chmod +x {} \; 2>/dev/null || true
          sudo find ${BUILD_DIR}/profile/airootfs/usr/local/bin -type f -exec chmod +x {} \; 2>/dev/null || true
          sudo find ${BUILD_DIR}/profile/airootfs/etc/aetheros -name "*.sh" -exec chmod +x {} \; 2>/dev/null || true

      # ── Step 5: Pull Arch Linux Docker Image ──────────────────
      - name: Pull Arch Linux Docker Image
        run: |
          echo "=== Disk space before Docker pull ==="
          df -h /
          echo ""
          docker pull archlinux:latest
          echo "=== Disk space after Docker pull ==="
          df -h /

      # ── Step 6: Build ISO Inside Arch Container ───────────────
      - name: Build AetherOS ISO
        run: |
          echo "=== Disk space before build ==="
          df -h /

          docker run --rm \
            --privileged \
            -v ${BUILD_DIR}/profile:${BUILD_DIR}/profile \
            -v ${BUILD_DIR}/work:${BUILD_DIR}/work \
            -v ${BUILD_DIR}/out:${BUILD_DIR}/out \
            -v pacman-cache:/var/cache/pacman/pkg \
            archlinux:latest \
            bash ${BUILD_DIR}/profile/airootfs/usr/local/bin/aetheros-build-helper.sh

          echo "=== Disk space after build ==="
          df -h /

      # ── Step 7: Verify ISO ────────────────────────────────────
      - name: Verify ISO and Generate Checksums
        run: |
          if ls ${BUILD_DIR}/out/*.iso 1>/dev/null 2>&1; then
            # Fix ownership: Docker + sudo created these as root-owned
            sudo chown -R $(id -u):$(id -g) ${BUILD_DIR}/out/
            
            ISO_FILE=$(ls ${BUILD_DIR}/out/*.iso | head -1)
            ISO_SIZE=$(du -h "$ISO_FILE" | cut -f1)
            echo "ISO built successfully: $ISO_FILE ($ISO_SIZE)"
            
            cd ${BUILD_DIR}/out
            sha256sum *.iso > SHA256SUMS
            md5sum *.iso > MD5SUMS
            
            echo "=== SHA256 ==="
            cat SHA256SUMS
            echo "=== MD5 ==="
            cat MD5SUMS
          else
            echo "ERROR: No ISO file found"
            ls -la ${BUILD_DIR}/out/ 2>/dev/null || true
            ls -la ${BUILD_DIR}/work/ 2>/dev/null || true
            exit 1
          fi

      # ── Step 8: Upload to GitHub Releases ─────────────────────
      - name: Upload ISO to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            /tmp/aetheros-build/out/*.iso
            /tmp/aetheros-build/out/SHA256SUMS
            /tmp/aetheros-build/out/MD5SUMS
          draft: false
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Step 9: Upload as Artifact ────────────────────────────
      - name: Upload ISO as Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AetherOS-ISO
          path: |
            /tmp/aetheros-build/out/*.iso
            /tmp/aetheros-build/out/SHA256SUMS
            /tmp/aetheros-build/out/MD5SUMS
          retention-days: 30
          compression-level: 0

      # ── Step 10: Build Report ──────────────────────────────────
      - name: Generate Build Report
        if: always()
        run: |
          echo "=== AetherOS Build Report ==="
          echo "Build Date: $(date)"
          echo "Commit: ${{ github.sha }}"
          df -h
