name: Build AetherOS ISO

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - nightly
          - testing

env:
  ISO_NAME: AetherOS
  BUILD_DIR: /tmp/aetheros-build

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours maximum

    steps:
      # ── Step 1: Maximize Build Space ──────────────────────────
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 512
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          build-mount-path: /tmp/aetheros-build
        continue-on-error: true

      - name: Check Disk Space
        run: df -h

      # ── Step 2: Checkout Repository ───────────────────────────
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ── Step 3: Cache Pacman Packages ─────────────────────────
      - name: Cache Pacman Packages
        uses: actions/cache@v4
        with:
          path: pacman-cache
          key: pacman-${{ hashFiles('archiso/packages.x86_64') }}-v2
          restore-keys: |
            pacman-v2-

      # ── Step 4: Prepare Build Environment ─────────────────────
      - name: Prepare Build Directory
        run: |
          sudo mkdir -p ${BUILD_DIR}/work ${BUILD_DIR}/out ${BUILD_DIR}/profile
          sudo mkdir -p pacman-cache

          # IMPORTANT: rsync copies CONTENTS of archiso/ INTO profile/,
          # not the archiso/ directory itself. cp -r would nest it wrong.
          sudo rsync -a archiso/ ${BUILD_DIR}/profile/
          sudo rsync -a scripts/ ${BUILD_DIR}/scripts/ 2>/dev/null || true
          sudo rsync -a overlays/ ${BUILD_DIR}/overlays/ 2>/dev/null || true

          # Verify profile structure matches mkarchiso expectations
          echo "=== Profile structure ==="
          ls ${BUILD_DIR}/profile/
          echo "=== airootfs ==="
          ls ${BUILD_DIR}/profile/airootfs/ || echo "No airootfs dir"
          echo "=== usr/local/bin ==="
          ls ${BUILD_DIR}/profile/airootfs/usr/local/bin/ 2>/dev/null || echo "No bin dir"

          # Make scripts executable
          sudo find ${BUILD_DIR}/profile -name "*.sh" -exec chmod +x {} \; 2>/dev/null || true
          sudo find ${BUILD_DIR}/profile/airootfs/usr/local/bin -type f -exec chmod +x {} \; 2>/dev/null || true
          sudo find ${BUILD_DIR}/profile/airootfs/etc/aetheros -name "*.sh" -exec chmod +x {} \; 2>/dev/null || true

      # ── Step 5: Build ISO Inside Arch Linux Docker ────────────
      # Single consolidated Docker run handles: pacman init, archiso install, ISO build
      - name: Build AetherOS ISO
        run: |
          # Pull Arch Linux Docker image
          docker pull archlinux:latest

          # Single Docker run for the entire build process
          # All state (keyring, archiso install, mkarchiso) persists in this container
          docker run --rm \
            --privileged \
            -v ${BUILD_DIR}/profile:${BUILD_DIR}/profile \
            -v ${BUILD_DIR}/work:${BUILD_DIR}/work \
            -v ${BUILD_DIR}/out:${BUILD_DIR}/out \
            -v pacman-cache:/var/cache/pacman/pkg \
            archlinux:latest \
            bash /tmp/aetheros-build/profile/airootfs/usr/local/bin/aetheros-build-helper.sh

      # ── Step 6: Verify ISO ────────────────────────────────────
      - name: Verify ISO and Generate Checksums
        run: |
          if ls ${BUILD_DIR}/out/*.iso 1>/dev/null 2>&1; then
            ISO_FILE=$(ls ${BUILD_DIR}/out/*.iso | head -1)
            ISO_SIZE=$(du -h "$ISO_FILE" | cut -f1)
            echo "ISO built successfully: $ISO_FILE ($ISO_SIZE)"
            
            cd ${BUILD_DIR}/out
            sha256sum *.iso > SHA256SUMS
            md5sum *.iso > MD5SUMS
            
            echo "=== SHA256 ==="
            cat SHA256SUMS
            echo "=== MD5 ==="
            cat MD5SUMS
          else
            echo "ERROR: No ISO file found in ${BUILD_DIR}/out/"
            ls -la ${BUILD_DIR}/out/ 2>/dev/null || echo "Output dir empty"
            ls -la ${BUILD_DIR}/work/ 2>/dev/null || echo "Work dir empty"
            exit 1
          fi

      # ── Step 7: Upload to GitHub Releases ─────────────────────
      - name: Upload ISO to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            /tmp/aetheros-build/out/*.iso
            /tmp/aetheros-build/out/SHA256SUMS
            /tmp/aetheros-build/out/MD5SUMS
          draft: false
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Step 8: Upload as Artifact ────────────────────────────
      - name: Upload ISO as Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AetherOS-ISO
          path: |
            /tmp/aetheros-build/out/*.iso
            /tmp/aetheros-build/out/SHA256SUMS
            /tmp/aetheros-build/out/MD5SUMS
          retention-days: 30
          compression-level: 0

      # ── Step 9: Build Report ──────────────────────────────────
      - name: Generate Build Report
        if: always()
        run: |
          echo "=== AetherOS Build Report ==="
          echo "Build Date: $(date)"
          echo "Build Type: ${{ github.event.inputs.build_type || 'release' }}"
          echo "Commit: ${{ github.sha }}"
          df -h
